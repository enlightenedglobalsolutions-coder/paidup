<script>
'use strict';

/* ---------- constants ---------- */
var APP_NAME='paidup';

var K_DATA='paidup.data';
var K_BAK='paidup.data__bak';
var K_INSTALL_DISMISS='paidup.installPromptDismissed';   /* app-prefixed, always (shared-origin rule) */
var K_BACKUP_SNOOZE='paidup.backupNudgeSnoozeUntil';

  {name:'What\u2019s For Dinner', line:'Find dinner without the scroll.', url:'https://wfdegs.ca'},

  {name:'Kept', line:'A quiet, private place for the people you\u2019ve loved.', url:''}
];
var CADENCES=[
  {id:'weekly',   label:'Weekly'},
  {id:'biweekly', label:'Every 2 weeks'},
  {id:'monthly',  label:'Monthly'},
  {id:'quarterly',label:'Every 3 months'},
  {id:'annual',   label:'Yearly'}
];
var SOURCES=[
  {id:'bank', label:'Bank account'},
  {id:'card', label:'Credit card'}
];
function sourceIcon(b){ return b.source==='card'?'💳':'🏦'; }
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* ---------- tiny helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function $(sel){ return document.querySelector(sel); }
function money(n){ return '$'+Number(n).toFixed(2); }
function todayStr(){ return ymd(new Date()); }

/* === EGS PURE CADENCE LOGIC START ===
   Pure, DOM-free, behavior-tested (test_paidup.js) against real dates for all
   five cadences. If you change ANYTHING here, re-run the tests. */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseYmd(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function clampDay(y,m,day){ return Math.min(day||1, daysInMonth(y,m)); }
function quarterOf(m){ return Math.floor(m/3)+1; }

/* All occurrences of a bill that fall due inside month m (0-based) of year y.
   Returns [{period, dueDate}] — period is the stable key one payment record
   exists under; dueDate is 'YYYY-MM-DD'. */
function occurrencesInMonth(bill,y,m){
  var out=[];
  if(bill.cadence==='monthly'){
    out.push({period:y+'-'+pad2(m+1), dueDate:ymd(new Date(y,m,clampDay(y,m,bill.dueDay)))});
  } else if(bill.cadence==='quarterly'){
    var anchor=(bill.dueMonth==null?0:bill.dueMonth);
    if((((m-anchor)%3)+3)%3===0){
      out.push({period:y+'-Q'+quarterOf(m), dueDate:ymd(new Date(y,m,clampDay(y,m,bill.dueDay)))});
    }
  } else if(bill.cadence==='annual'){
    if(m===(bill.dueMonth==null?0:bill.dueMonth)){
      out.push({period:String(y), dueDate:ymd(new Date(y,m,clampDay(y,m,bill.dueDay)))});
    }
  } else if(bill.cadence==='weekly'){
    var dim=daysInMonth(y,m), wd=(bill.dueWeekday==null?1:bill.dueWeekday);
    for(var d=1;d<=dim;d++){
      var dt=new Date(y,m,d);
      if(dt.getDay()===wd) out.push({period:ymd(dt), dueDate:ymd(dt)});
    }
  } else if(bill.cadence==='biweekly'){
    if(!bill.anchorDate) return out;
    var a=parseYmd(bill.anchorDate);
    var first=new Date(y,m,1), last=new Date(y,m,daysInMonth(y,m));
    var msDay=86400000;
    var k=Math.max(0, Math.floor((first-a)/(14*msDay))-2); /* start early; DST-safe date math below */
    for(;;k++){
      var dt2=new Date(a.getFullYear(),a.getMonth(),a.getDate()+14*k);
      if(dt2>last) break;
      if(dt2>=first) out.push({period:ymd(dt2), dueDate:ymd(dt2)});
    }
  }
  return out;
}

/* overdue / soon (<=5 days) / upcoming / paid */
function statusFor(p,today){
  if(p.paid) return 'paid';
  if(p.dueDate<today) return 'overdue';
  var diff=Math.round((parseYmd(p.dueDate)-parseYmd(today))/86400000);
  return diff<=5 ? 'soon' : 'upcoming';
}

/* human label for a stored period key */
function periodDisplay(period){
  if(/^\d{4}-\d{2}$/.test(period)){ var p=period.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
  if(/^\d{4}-Q\d$/.test(period)){ return period.slice(5)+' '+period.slice(0,4); }
  if(/^\d{4}$/.test(period)){ return period; }
  if(/^\d{4}-\d{2}-\d{2}$/.test(period)){ var d=parseYmd(period); return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear(); }
  return period;
}
/* === EGS PURE CADENCE LOGIC END === */

/* ---------- storage (EGS-STD:schema) ----------
   One store under K_DATA, schema-numbered, and the loader BRANCHES on the
   number — written AND read, both halves (the Rollworthy lesson). safeSave
   backs up to __bak before every write and refuses to write an empty store
   over real data unless the caller explicitly says so. */
var db=null;

function emptyDb(){
  return { schema:SCHEMA_CURRENT,
    categories:[
      {id:uid(),label:'Housing',icon:'\uD83C\uDFE0'},
      {id:uid(),label:'Utilities',icon:'\uD83D\uDCA1'},
      {id:uid(),label:'Phone & Internet',icon:'\uD83D\uDCF6'},
      {id:uid(),label:'Insurance',icon:'\uD83D\uDEE1\uFE0F'},
      {id:uid(),label:'Vehicle',icon:'\uD83D\uDE97'},
      {id:uid(),label:'Subscriptions',icon:'\uD83D\uDCFA'},
      {id:uid(),label:'Other',icon:'\uD83D\uDCC1'}
    ],
    bills:[], payments:[],
    settings:{ theme:'system', beginner:true, lastBackupAt:null }
  };
}
function migrate(obj){
  if(!obj || typeof obj!=='object') throw new Error('bad store');
  if(obj.schema==null){ obj.schema=1; }               /* pre-schema legacy shape -> v1 */
  if(obj.schema===1){
    if(!obj.settings) obj.settings={theme:'system',beginner:true,lastBackupAt:null};
    if(!Array.isArray(obj.categories)) obj.categories=[];
    if(!Array.isArray(obj.bills)) obj.bills=[];
    if(!Array.isArray(obj.payments)) obj.payments=[];
    obj.bills.forEach(function(b){ if(!b.source) b.source='bank'; });   /* v1->v2: payment-source axis, default bank */
    obj.schema=2;
  }
  if(obj.schema===2){
    if(!obj.settings) obj.settings={theme:'system',beginner:true,lastBackupAt:null};
    if(!Array.isArray(obj.categories)) obj.categories=[];
    if(!Array.isArray(obj.bills)) obj.bills=[];
    if(!Array.isArray(obj.payments)) obj.payments=[];
    obj.bills.forEach(function(b){ if(!b.source) b.source='bank'; });
    return obj;                                        /* current — no migration needed */
  }
  throw new Error('PaidUp data was saved by a newer version (schema '+obj.schema+'). Update the app before opening this data.');
}
function hasRealData(o){ return !!(o && ((o.bills&&o.bills.length) || (o.payments&&o.payments.length))); }
function safeLoad(){
  var raw=null, obj=null;
  try{ raw=localStorage.getItem(K_DATA); if(raw) obj=migrate(JSON.parse(raw)); }
  catch(e){ obj=null; }
  if(!obj){
    try{ var b=localStorage.getItem(K_BAK); if(b){ obj=migrate(JSON.parse(b)); } }catch(e2){ obj=null; }
  }
  return obj || emptyDb();
}
function safeSave(opts){
  opts=opts||{};
  try{
    var current=localStorage.getItem(K_DATA);
    if(current && !opts.allowShrinkToEmpty){
      try{ if(hasRealData(JSON.parse(current)) && !hasRealData(db)){
        console.warn('safeSave blocked: refusing to write empty over real data'); return false;
      }}catch(e){}
    }
    if(current) localStorage.setItem(K_BAK,current);   /* backup before any write (Tier 1) */
    localStorage.setItem(K_DATA,JSON.stringify(db));
    return true;
  }catch(e){ console.error('save failed',e); return false; }
}

/* ---------- derived ---------- */
function catById(id){ for(var i=0;i<db.categories.length;i++) if(db.categories[i].id===id) return db.categories[i]; return null; }
function billById(id){ for(var i=0;i<db.bills.length;i++) if(db.bills[i].id===id) return db.bills[i]; return null; }
function payById(id){ for(var i=0;i<db.payments.length;i++) if(db.payments[i].id===id) return db.payments[i]; return null; }
function lastKnownAmount(bill){
  var best=null;
  for(var i=0;i<db.payments.length;i++){
    var p=db.payments[i];
    if(p.billId===bill.id && p.amount>0){ if(!best || p.createdAt>best.createdAt) best=p; }
  }
  return best ? best.amount : (bill.typicalAmount||0);
}
/* opening the app is what generates this month's bills — never a manual step */
function ensureCurrentPeriodPayments(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth(), changed=false;
  db.bills.forEach(function(bill){
    if(bill.archived) return;
    occurrencesInMonth(bill,y,m).forEach(function(oc){
      var exists=db.payments.some(function(p){ return p.billId===bill.id && p.period===oc.period; });
      if(!exists){
        db.payments.push({ id:uid(), billId:bill.id, period:oc.period, amount:lastKnownAmount(bill),
          paid:false, paidAt:null, dueDate:oc.dueDate, createdAt:new Date().toISOString() });
        changed=true;
      }
    });
  });
  if(changed) safeSave();
}
function thisMonthPayments(){
  /* dueDate is always inside the due month, for every cadence — so this one
     check is correct for all five (a March-due annual bill must NOT sit on
     Home in August just because its period key is the whole year) */
  var now=new Date(), pre=now.getFullYear()+'-'+pad2(now.getMonth()+1);
  return db.payments.filter(function(p){
    var b=billById(p.billId); if(!b||b.archived) return false;
    return p.dueDate.slice(0,7)===pre;
  });
}
function unpaidAttention(){
  var t=todayStr();
  var list=db.payments.filter(function(p){
    var b=billById(p.billId); if(!b||b.archived||p.paid) return false;
    var s=statusFor(p,t); return s==='overdue'||s==='soon';
  });
  return list;
}

/* ---------- rendering ---------- */
var screen='home', detailBillId=null, openHistoryMonths={};
/* span, not button: infoI() is placed inside other interactive elements
   (e.g. the Settings toggle-beginner row is itself a <button>) — a nested
   <button> forces the HTML parser to close the outer one early, silently
   splitting the row's DOM and losing .info-i's fixed sizing to the broader
   .linklist button selector. role="button" keeps it announced/clickable;
   the click delegation below matches on [data-action], not tag name. */
function infoI(key){ return '<span class="info-i" role="button" tabindex="0" data-action="info" data-info="'+key+'" aria-label="What is this?">i</span>'; }

function render(){
  ensureCurrentPeriodPayments();
  document.body.classList.toggle('expert', !db.settings.beginner);
  var el=$('#main');
  if(screen==='home') el.innerHTML=renderHome();
  else if(screen==='bills') el.innerHTML=renderBills();
  else if(screen==='detail') el.innerHTML=renderDetail();
  else if(screen==='history') el.innerHTML=renderHistory();
  else if(screen==='settings') el.innerHTML=renderSettings();
  else if(screen==='support') el.innerHTML=renderSupport();
  else if(screen==='privacy') el.innerHTML=renderPrivacy();
  var tabFor={home:'home',bills:'bills',detail:'bills',history:'history',settings:'settings',support:'settings',privacy:'settings'}[screen];
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.screen===tabFor); });
  renderBanners();
}

function paymentRow(p){
  var b=billById(p.billId), c=b?catById(b.categoryId):null, t=todayStr(), s=statusFor(p,t);
  var dueTxt;
  if(s==='paid') dueTxt='Paid '+(p.paidAt?periodDisplay(p.paidAt):'');
  else{
    var diff=Math.round((parseYmd(p.dueDate)-parseYmd(t))/86400000);
    dueTxt = diff<0 ? (Math.abs(diff)+'d overdue') : diff===0 ? 'Due today' : diff===1 ? 'Due tomorrow' : 'Due '+periodDisplay(p.dueDate);
  }
  return '<div class="row st-'+s+'">'
    +'<button class="paycircle" data-action="toggle-paid" data-id="'+p.id+'" aria-label="Mark paid"><span class="ring"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></span></button>'
    +'<div class="main" data-action="open-bill" data-id="'+(b?b.id:'')+'">'
      +'<div class="name">'+(c?'<span style="margin-right:5px">'+esc(c.icon)+'</span>':'')+esc(b?b.name:'(deleted bill)')+'</div>'
      +'<div class="sub"><span class="chip '+(b&&b.method==='autopay'?'auto':'')+'">'+(b&&b.method==='autopay'?'Autopay':'I pay this')+'</span>'
      +'<span class="due '+(s==='overdue'?'overdue':s==='soon'?'soon':'')+'">'+esc(dueTxt)+'</span></div>'
    +'</div>'
    +'<button class="amt '+(p.amount>0?'':'unset')+'" data-action="edit-amount" data-id="'+p.id+'">'+(p.amount>0?money(p.amount):'set $')+'</button>'
  +'</div>';
}

function renderHome(){
  var now=new Date();
  var list=thisMonthPayments();
  var t=todayStr();
  var order={overdue:0,soon:1,upcoming:2,paid:3};
  list.sort(function(a,b){
    var d=order[statusFor(a,t)]-order[statusFor(b,t)];
    return d!==0 ? d : (a.dueDate<b.dueDate?-1:1);
  });
  var attn=unpaidAttention();
  var h='';
  if(attn.length){
    var od=attn.filter(function(p){return statusFor(p,t)==='overdue';}).length;

  }
  h+='<div class="sec-title">'+MONTHS[now.getMonth()]+' '+now.getFullYear()+' '+infoI('home')+'</div>';

    h+='<div class="card"><div class="empty"><div class="big">\uD83E\uDDFE</div>'
      +'<p><b>Nothing due yet.</b></p><p>Add your regular bills once and PaidUp lays out each month for you \u2014 what\u2019s paid, what\u2019s not, and what\u2019s coming.</p>'
      +'<button class="btn block" data-action="add-bill">Add your first bill</button></div></div>';
  }else{
    h+='<div class="card">'+list.map(paymentRow).join('')+'</div>';

}

function billLine(b){
  var c=catById(b.categoryId);
  var cad=CADENCES.filter(function(x){return x.id===b.cadence;})[0];
  var when='';
  if(b.cadence==='monthly') when='day '+b.dueDay;
  else if(b.cadence==='quarterly') when='day '+b.dueDay+', '+[0,1,2].map(function(i){return MONTHS[(b.dueMonth+i*3)%12].slice(0,3);}).join('/') + '/' + MONTHS[(b.dueMonth+9)%12].slice(0,3);
  else if(b.cadence==='annual') when=MONTHS[b.dueMonth]+' '+b.dueDay;
  else if(b.cadence==='weekly') when=WEEKDAYS[b.dueWeekday]+'s';
  else if(b.cadence==='biweekly') when='from '+periodDisplay(b.anchorDate);
  return '<div class="row" data-action="open-bill" data-id="'+b.id+'">'
    +'<div class="cat-emoji">'+esc(c?c.icon:'\uD83D\uDCC1')+'</div>'
    +'<div class="main"><div class="name">'+esc(b.name)+(b.archived?' <span class="chip">archived</span>':'')+'</div>'
    +'<div class="sub"><span>'+esc(cad?cad.label:b.cadence)+' \u00B7 '+esc(when)+'</span>'
    +'<span class="chip '+(b.method==='autopay'?'auto':'')+'">'+(b.method==='autopay'?'Autopay':'Manual')+'</span>'
    +'<span class="chip">'+sourceIcon(b)+' '+(b.source==='card'?'Credit card':'Bank account')+'</span></div></div>'
    +'<svg class="chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>'
  +'</div>';
}
function renderBills(){
  var active=db.bills.filter(function(b){return !b.archived;});
  var arch=db.bills.filter(function(b){return b.archived;});
  var h='<div class="sec-title">Your bills '+infoI('bills')+'</div>';
  if(!db.bills.length){
    h+='<div class="card"><div class="empty"><div class="big">\uD83D\uDCEC</div><p><b>No bills yet.</b></p><p>Add each recurring bill once \u2014 rent, power, phone, insurance \u2014 and choose how often it comes.</p></div></div>';
  }else{
    if(active.length) h+='<div class="card">'+active.map(billLine).join('')+'</div>';
    if(arch.length) h+='<div class="sec-title">Archived</div><div class="card">'+arch.map(billLine).join('')+'</div>';

function renderDetail(){
  var b=billById(detailBillId);
  if(!b){ screen='bills'; return renderBills(); }
  var c=catById(b.categoryId);
  var pays=db.payments.filter(function(p){return p.billId===b.id;});
  pays.sort(function(a,x){ return a.dueDate<x.dueDate?1:-1; });
  var byYear={};
  pays.forEach(function(p){ var y=p.period.slice(0,4); (byYear[y]=byYear[y]||[]).push(p); });
  var years=Object.keys(byYear).sort().reverse();
  var h='<button class="backlink" data-action="nav" data-screen="bills"><svg class="chev" style="transform:rotate(180deg)" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>All bills</button>';
  h+='<div class="card"><div class="pad">'
    +'<h2 style="font-size:19px">'+(c?esc(c.icon)+' ':'')+esc(b.name)+'</h2>'
    +'<div class="sub" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="chip '+(b.method==='autopay'?'auto':'')+'">'+(b.method==='autopay'?'Autopay':'I pay this')+'</span>'
    +'<span class="chip">'+sourceIcon(b)+' '+(b.source==='card'?'Credit card':'Bank account')+'</span>'
    +'<span class="chip">'+esc((CADENCES.filter(function(x){return x.id===b.cadence;})[0]||{}).label||b.cadence)+'</span>'
    +(b.archived?'<span class="chip">archived</span>':'')+'</div>'
    +'<div class="btnrow" style="display:flex;gap:10px;margin-top:14px">'
    +'<button class="btn ghost small" data-action="edit-bill" data-id="'+b.id+'">Edit</button>'
    +'<button class="btn ghost small" data-action="archive-bill" data-id="'+b.id+'">'+(b.archived?'Unarchive':'Archive')+'</button>'
    +'<button class="btn ghost small" style="color:var(--danger);border-color:var(--danger)" data-action="delete-bill" data-id="'+b.id+'">Delete</button>'
    +'</div></div></div>';
  h+='<div class="sec-title">Payment history '+infoI('history')+'</div>';
  h+='<button class="btn ghost block" data-action="backfill-payment" data-id="'+b.id+'">+ Add a past payment</button>';
  if(!pays.length) h+='<div class="card"><div class="empty"><p>No payments recorded yet \u2014 they appear here as each due period arrives.</p></div></div>';
  years.forEach(function(y){
    var total=byYear[y].reduce(function(s,p){ return s+(p.paid?(p.amount||0):0); },0);
    /* monthly rollup groups by dueDate's month, not period — a weekly or
       biweekly bill can have several periods land in the same calendar
       month, and only dueDate reflects that; monthly/quarterly/annual bills
       get one payment per month regardless, so this is a no-op for them. */
    var monthOrder=[], byMonth={};
    byYear[y].forEach(function(p){
      var mk=p.dueDate.slice(0,7);
      if(!byMonth[mk]){ byMonth[mk]=[]; monthOrder.push(mk); }
      byMonth[mk].push(p);
    });
    h+='<div class="card"><div class="yeartotal"><span>'+y+'</span><span>'+money(total)+' paid</span></div>'
      +monthOrder.map(function(mk){
        var mPays=byMonth[mk];
        var mTotal=mPays.reduce(function(s,p){ return s+(p.paid?(p.amount||0):0); },0);
        return '<div class="monthtotal"><span>'+esc(MONTHS[+mk.slice(5,7)-1])+'</span><span>'+money(mTotal)+' paid</span></div>'
          +mPays.map(function(p){
            var s=statusFor(p,todayStr());
            return '<div class="row st-'+s+'">'
              +'<button class="paycircle" data-action="toggle-paid" data-id="'+p.id+'"><span class="ring"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></span></button>'
              +'<div class="main"><div class="name">'+esc(periodDisplay(p.period))+'</div>'
              +'<div class="sub"><span class="due">'+(p.paid?('Paid'+(p.paidAt?' '+periodDisplay(p.paidAt):'')):('Due '+esc(periodDisplay(p.dueDate))))+'</span></div></div>'
              +'<button class="amt '+(p.amount>0?'':'unset')+'" data-action="edit-amount" data-id="'+p.id+'">'+(p.amount>0?money(p.amount):'set $')+'</button>'
            +'</div>';
          }).join('');
      }).join('')+'</div>';
  });
  h+='<div class="foot">PaidUp \u00B7 v<span id="verFoot"></span> \u00B7 EGS</div>';
  return h;
}

/* Portfolio-level spend history — every calendar month, across every bill
   (archived included; deleted bills' payments are already removed at delete
   time), newest first. Grouped by dueDate's month so weekly/biweekly periods
   land in the month they actually fell due, same rule renderDetail uses for
   its per-bill monthly rollup. Only paid amounts count, so totals reconcile
   with the per-bill totals shown in bill detail. */
function historyByMonth(){
  var byMonth={};
  db.payments.forEach(function(p){
    if(!p.paid) return;
    var b=billById(p.billId); if(!b) return;   /* deleted bill — payments already gone, but be defensive */
    var mk=p.dueDate.slice(0,7);
    (byMonth[mk]=byMonth[mk]||[]).push(p);
  });
  return byMonth;
}
function renderHistory(){
  var byMonth=historyByMonth();
  var months=Object.keys(byMonth).sort().reverse();
  var h='<div class="sec-title">Spend history '+infoI('spendhistory')+'</div>';
  if(!months.length){
    h+='<div class="card"><div class="empty"><div class="big">\uD83D\uDCC5</div>'
      +'<p><b>No history yet.</b></p><p>Once you start marking bills paid, each month\u2019s total shows up here \u2014 newest first.</p></div></div>';
    h+='<div class="foot">PaidUp \u00B7 v<span id="verFoot"></span> \u00B7 EGS</div>';
    return h;
  }
  h+='<div class="card">'+months.map(function(mk){
    var pays=byMonth[mk].slice().sort(function(a,x){ return a.dueDate<x.dueDate?-1:1; });
    var total=pays.reduce(function(s,p){ return s+(p.amount||0); },0);
    var open=!!openHistoryMonths[mk];
    var label=MONTHS[+mk.slice(5,7)-1]+' '+mk.slice(0,4);
    var head='<div class="row" data-action="toggle-history-month" data-month="'+mk+'">'
      +'<div class="main"><div class="name">'+esc(label)+'</div>'
      +'<div class="sub">'+pays.length+' payment'+(pays.length===1?'':'s')+'</div></div>'
      +'<div class="amt" style="pointer-events:none">'+money(total)+'</div>'
      +'<svg class="chev" style="transform:rotate('+(open?90:0)+'deg)" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>'
    +'</div>';
    if(!open) return head;
    var rows=pays.map(function(p){
      var b=billById(p.billId), c=b?catById(b.categoryId):null;
      return '<div class="row hist-sub" data-action="open-bill" data-id="'+b.id+'">'
        +'<div class="cat-emoji">'+esc(c?c.icon:'\uD83D\uDCC1')+'</div>'
        +'<div class="main"><div class="name">'+esc(b.name)+(b.archived?' <span class="chip">archived</span>':'')+'</div>'
        +'<div class="sub"><span>'+esc(periodDisplay(p.dueDate))+'</span></div></div>'
        +'<div class="amt" style="pointer-events:none">'+money(p.amount)+'</div>'
      +'</div>';
    }).join('');
    return head+rows;
  }).join('')+'</div>';
  h+='<div class="foot">PaidUp \u00B7 v<span id="verFoot"></span> \u00B7 EGS</div>';
  return h;
}

/* ---------- banners: install prompt + backup nudge (never stacked) ---------- */
/* EGS-STD:install-banner */
var deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredInstall=e; renderBanners(); });
/* The installing tab never becomes standalone, so without this the banner would
   sit there after a successful install — the one case it must stop asking. */
window.addEventListener('appinstalled',function(){ deferredInstall=null; localStorage.setItem(K_INSTALL_DISMISS,'1'); renderBanners(); });
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
var persistedOk=null;
function backupNudgeWanted(){
  if(!hasRealData(db)) return false;                              /* an empty app never nags */
  var snooze=+(localStorage.getItem(K_BACKUP_SNOOZE)||0);
  if(Date.now()<snooze) return false;                             /* dismiss snoozes 7 days */
  var last=db.settings.lastBackupAt?Date.parse(db.settings.lastBackupAt):0;
  var stale=!last || (Date.now()-last)>21*86400000;               /* trigger: 21+ days or never */
  return stale || persistedOk===false;
}
/* Wanted for ANY browser that isn't already installed and hasn't dismissed -
   NOT gated on deferredInstall. Chrome fires beforeinstallprompt seconds after
   load, and gating on it meant Android users saw nothing in that window; when
   they touched the app first the backup nudge took the slot and the install
   banner never returned. Manual instructions cover the gap, and the event
   (which calls renderBanners) hot-swaps in the native Install button. */
function installBannerWanted(){
  if(isStandalone()) return false;
  if(localStorage.getItem(K_INSTALL_DISMISS)) return false;
  return true;
}
function renderBanners(){
  var host=$('#banners'); var h='';
  /* Install owns the slot until it is dismissed or the app is installed. It is
     a one-time ask that dies forever if it loses the race; the backup nudge is
     recurring and re-offers itself, so it is the one that can afford to wait. */
  if(installBannerWanted()){
    var body = deferredInstall
      ? 'Install it to your home screen \u2014 works fully offline.'
      : isIOS()
        ? 'On iPhone: tap Share, then \u201CAdd to Home Screen\u201D \u2014 works fully offline.'
        : 'On Android: tap the \u22EE menu, then \u201CAdd to Home screen\u201D \u2014 works fully offline.';
    h='<div class="notice" style="position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;box-shadow:var(--shadow)">'
      +'<div class="txt"><b>PaidUp is an app \uD83D\uDCF1</b>'+body+'</div>'
      +'<div class="actions">'+(deferredInstall?'<button class="btn small" data-action="install">Install</button>':'')
      +'<button class="btn ghost small" data-action="dismiss-install">Got it</button></div></div>';
  } else if(backupNudgeWanted()){
    h='<div class="notice" style="position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;box-shadow:var(--shadow)">'
      +'<div class="txt"><b>Keep a backup \uD83D\uDCBE</b>Your bills live only on this phone. One tap saves them to a file you own.</div>'
      +'<div class="actions"><button class="btn small" data-action="export">Back up now</button>'
      +'<button class="btn ghost small" data-action="snooze-backup">Later</button></div></div>';
  }
  host.innerHTML=h;
}

  b.categoryId=$('#f-cat').value;

  b.source=$('#f-source .on').dataset.val;

/* Back-filling past payments (EGS-STD:backfill) \u2014 for a period that predates
   the bill being added, so ensureCurrentPeriodPayments never created a row
   for it. occurrencesInMonth is the same pure generator the auto-create path
   uses, so a back-filled dueDate always matches what the cadence would have
   produced \u2014 never hand-built. */
function backfillOccurrences(bill,monthVal){
  if(!monthVal) return [];
  var parts=monthVal.split('-'); var y=+parts[0], m=+parts[1]-1;
  var existing={};
  db.payments.forEach(function(p){ if(p.billId===bill.id) existing[p.period]=true; });
  return occurrencesInMonth(bill,y,m).filter(function(o){ return !existing[o.period]; });
}
/* Pure record-builder for the save-backfill action: given a bill, the
   chosen year/month, the period key the user selected, and the raw amount
   input, either returns { payment } to push or { error } to show — split
   out of the click handler solely so it's callable without a DOM. */
function buildBackfillPayment(bill,y,m,period,amountRaw){
  var oc=occurrencesInMonth(bill,y,m).filter(function(o){ return o.period===period; })[0];
  if(!oc) return { error:'That due date isn\u2019t available anymore \u2014 pick the month again.' };
  if(db.payments.some(function(p){ return p.billId===bill.id && p.period===oc.period; })){
    return { error:'That period already has a payment.', duplicate:true };
  }
  var amount=parseFloat(amountRaw);
  if(!(amount>=0)) return { error:'Enter an amount.' };
  return { payment:{ id:uid(), billId:bill.id, period:oc.period, amount:amount,
    paid:true, paidAt:oc.dueDate, dueDate:oc.dueDate, createdAt:new Date().toISOString() } };
}
function backfillPeriodFieldHtml(bill,monthVal){
  var oc=backfillOccurrences(bill,monthVal);
  if(!oc.length) return '<p style="color:var(--muted);font-size:13px;margin:-6px 0 14px">No due date left to add for that month \u2014 it may already have a payment, or this bill isn\u2019t due then.</p>';
  return '<div class="field"><label>Which due date</label><select id="f-bf-period">'
    +oc.map(function(o){ return '<option value="'+esc(o.period)+'">'+esc(periodDisplay(o.dueDate))+'</option>'; }).join('')
    +'</select></div>';
}

/* ---------- export / import (EGS-STD:backup) ---------- */
function doExport(){
  var payload={ app:APP_NAME, schema:SCHEMA_CURRENT, exportedAt:new Date().toISOString(), data:db };
  var blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='paidup-backup-'+todayStr()+'.json';        /* app-named, always */
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  db.settings.lastBackupAt=new Date().toISOString();
  safeSave(); render();
}
function doImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      if(obj.app!==APP_NAME || !obj.data) throw new Error('That file isn\u2019t a PaidUp backup.');
      var incoming=migrate(obj.data);
      if(!confirm('Restore this backup? It REPLACES everything currently in PaidUp on this device.')) return;
      db=incoming;
      safeSave({allowShrinkToEmpty:true});
      screen='home'; render();
      alert('Backup restored.');
    }catch(e){ alert('Couldn\u2019t restore: '+(e.message||'unreadable file')); }
  };
  r.readAsText(file);
}

/* ---------- share (payload = app URL only, never user data) ---------- */
function doShare(){
  var data={ title:'PaidUp', text:'PaidUp \u2014 know what\u2019s paid, what\u2019s not. Free, private, works offline.', url:APP_URL };
  if(navigator.share){ navigator.share(data).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(APP_URL).then(function(){ alert('Link copied \u2014 paste it anywhere.'); }); }
  else{ prompt('Copy the link:', APP_URL); }
}

/* ---------- theme (EGS-STD:themes) ---------- */
var mql=window.matchMedia('(prefers-color-scheme: dark)');

  var t=db.settings.theme;
  var resolved = t==='system' ? (mql.matches?'dark':'light') : t;
  document.documentElement.dataset.theme=resolved;
}

/* ---------- actions (event delegation — zero inline handlers) ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-action]');
  if(!el) return;
  var act=el.dataset.action, id=el.dataset.id;
  if(act==='nav'){ ev.preventDefault(); screen=el.dataset.screen; closeModal(); render(); window.scrollTo(0,0); }
  else if(act==='share'){ doShare(); }
  else if(act==='info'){ ev.stopPropagation(); showInfo(el.dataset.info); }
  else if(act==='info-close'){ if(ev.target===el||el.tagName==='BUTTON') $('#infoSheet').innerHTML=''; }
  else if(act==='modal-bg'){ if(ev.target===el) closeModal(); }
  else if(act==='modal-close'){ closeModal(); }
  else if(act==='add-bill'){ openModal(billFormHtml(null)); }
  else if(act==='edit-bill'){ openModal(billFormHtml(billById(id))); }
  else if(act==='save-bill'){
    var existing=id?billById(id):null;
    var b=readBillForm(existing); if(!b) return;
    if(!existing) db.bills.push(b);
    safeSave(); closeModal(); ensureCurrentPeriodPayments(); render();
  }
  else if(act==='open-bill'){ if(id){ detailBillId=id; screen='detail'; render(); window.scrollTo(0,0); } }
  else if(act==='toggle-history-month'){
    var mk=el.dataset.month;
    openHistoryMonths[mk]=!openHistoryMonths[mk];
    render();
  }
  else if(act==='backfill-payment'){ backfillModal(id); }
  else if(act==='save-backfill'){
    var bfBill=billById(id); if(!bfBill) return;
    var mv=$('#f-bf-month').value;
    if(!mv){ alert('Pick a month.'); return; }
    var mp=mv.split('-'); var by=+mp[0], bm=+mp[1]-1;
    var bfSel=$('#f-bf-period');
    if(!bfSel || !bfSel.value){ alert('No due date available to add for that month.'); return; }
    var bfResult=buildBackfillPayment(bfBill,by,bm,bfSel.value,$('#f-bf-amount').value);
    if(bfResult.error){
      alert(bfResult.error);
      if(bfResult.duplicate){ closeModal(); render(); }   /* dedupe guard */
      return;
    }
    db.payments.push(bfResult.payment);
    safeSave(); closeModal(); render();
  }
  else if(act==='archive-bill'){
    var ab=billById(id); if(!ab) return;
    ab.archived=!ab.archived; ab.updatedAt=new Date().toISOString();
    safeSave(); render();
  }
  else if(act==='delete-bill'){
    var dbill=billById(id); if(!dbill) return;
    /* delete requires confirmation — Tier 1, no exceptions */
    if(!confirm('Delete \u201C'+dbill.name+'\u201D and its entire payment history? This can\u2019t be undone. (Archive instead if you just want it out of the way.)')) return;
    db.bills=db.bills.filter(function(x){return x.id!==id;});
    db.payments=db.payments.filter(function(x){return x.billId!==id;});
    safeSave(); screen='bills'; render();
  }
  else if(act==='toggle-paid'){
    var p=payById(id); if(!p) return;
    if(!p.paid && !(p.amount>0)){ amountModal(id,true); return; }  /* prompts once if unset, then remembers */
    p.paid=!p.paid; p.paidAt=p.paid?todayStr():null;
    safeSave(); render();
  }
  else if(act==='edit-amount'){ amountModal(id,false); }
  else if(act==='save-amount'){
    var pm=payById(id); if(!pm) return;
    var v=parseFloat($('#f-payamt').value);
    if(!(v>=0)){ alert('Enter a number.'); return; }
    pm.amount=v;
    if(el.dataset.thenpaid==='1' && !pm.paid){ pm.paid=true; pm.paidAt=todayStr(); }
    safeSave(); closeModal(); render();
  }
  else if(act==='manage-cats'){ catsModal(); }
  else if(act==='cat-add'){ catEditModal(null); }
  else if(act==='cat-edit'){ catEditModal(id); }
  else if(act==='cat-save'){
    var lbl=$('#f-clabel').value.trim(); if(!lbl){ alert('Give it a name.'); return; }
    var icn=$('#f-cicon').value.trim()||'\uD83D\uDCC1';
    var ec=id?catById(id):null;
    if(ec){ ec.label=lbl; ec.icon=icn; } else db.categories.push({id:uid(),label:lbl,icon:icn});
    safeSave(); catsModal();
  }
  else if(act==='cat-up'){
    var idx=db.categories.findIndex(function(c){return c.id===id;});
    if(idx>0){ var tmp=db.categories[idx-1]; db.categories[idx-1]=db.categories[idx]; db.categories[idx]=tmp; safeSave(); catsModal(); }
  }
  else if(act==='cat-del'){
    var dc=catById(id); if(!dc) return;
    /* deleting a category never deletes bills — they become uncategorized */
    if(!confirm('Delete the \u201C'+dc.label+'\u201D category? Bills in it are kept and just show as uncategorized.')) return;
    db.categories=db.categories.filter(function(c){return c.id!==id;});
    safeSave(); catsModal();
  }
  else if(act==='cycle-theme'){
    var seq=['system','light','dark'];
    db.settings.theme=seq[(seq.indexOf(db.settings.theme)+1)%3];
    safeSave(); applyTheme(); render();
  }
  else if(act==='toggle-beginner'){ db.settings.beginner=!db.settings.beginner; safeSave(); render(); }
  else if(act==='export'){ doExport(); }
  else if(act==='snooze-backup'){ localStorage.setItem(K_BACKUP_SNOOZE, String(Date.now()+7*86400000)); renderBanners(); }
  else if(act==='import'){
    if(screen!=='support'){ screen='support'; render(); }
    var fi=$('#importFile'); if(fi) fi.click();
  }
  else if(act==='install'){
    if(deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.then(function(){ deferredInstall=null; renderBanners(); }); }
  }
  else if(act==='dismiss-install'){ localStorage.setItem(K_INSTALL_DISMISS,'1'); renderBanners(); }
  else if(act==='paytab'){
    document.querySelectorAll('.paytabs button').forEach(function(bn){ bn.classList.toggle('on',bn===el); });
    $('#paybody').innerHTML=payTabHtml(el.dataset.tab);   /* in-place patch, no page re-render */
  }
  else if(act==='refresh-app'){ location.reload(); }
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='importFile' && ev.target.files.length){ doImport(ev.target.files[0]); ev.target.value=''; }
  if(ev.target.id==='f-cadence'){ $('#f-when').innerHTML=cadenceFieldsHtml(ev.target.value,{}); }
  if(ev.target.id==='f-bf-month'){
    var bfb=billById(ev.target.dataset.billid);
    $('#f-bf-periodwrap').innerHTML = bfb ? backfillPeriodFieldHtml(bfb, ev.target.value) : '';
  }
});
document.addEventListener('click',function(ev){
  var seg=ev.target.closest('.seg button');
  if(seg){ seg.parentElement.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); seg.classList.add('on'); }
});

/* ---------- version stamping into the visible page ---------- */
var _origRender=render;
render=function(){
  _origRender();
  document.querySelectorAll('#verFoot').forEach(function(n){ n.textContent=window.EGS_VERSION; });
  var vs=$('#verSet'); if(vs) vs.textContent=window.EGS_VERSION;
};

/* ---------- service worker registration (standard EGS snippet) ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js').then(function(reg){
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed' && navigator.serviceWorker.controller){
          $('#refreshBanner').classList.remove('hide');
        }
      });
    });
  }).catch(function(){});
}

/* ---------- init ---------- */
db=safeLoad();
safeSave();                                  /* materialize a fresh store on first run */
applyTheme();
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().then(function(){ 
    return navigator.storage.persisted ? navigator.storage.persisted() : null;
  }).then(function(ok){ persistedOk=(ok===true); renderBanners(); }).catch(function(){});
}
render();
</script>
</body>
</html>
